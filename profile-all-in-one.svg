<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="100%" role="img" aria-label="Welcome to my profile. First-year Data Science student at Universidad Austral (Rosario). Learning Python, R, HTML, CSS, JavaScript, Git and GitHub. Into music, art and dance. Open to any project. Cat and pink lover." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .lbl { fill: #ff8fcb; font-size: 13px; }
    .val { fill: #ffe0f0; font-size: 14px; }
    .dim { fill: #b0588a; font-size: 12px; }
    .tag { fill: #ff69b4; font-size: 13px; font-weight: bold; }
    .cat { fill: #ff9bd2; font-size: 18px; white-space: pre; }
    .title { fill: #ff8fcb; font-size: 44px; font-weight: bold; }
    .sub { fill: #ffc2e2; font-size: 14px; }

    .typer { animation: type 18s steps(21) infinite; }
    @keyframes type { 0% { width: 0; } 18% { width: 560px; } 92% { width: 560px; } 98%, 100% { width: 0; } }
    .cursor { animation: move 18s steps(21) infinite, blink 0.9s steps(1) infinite; }
    @keyframes move { 0% { transform: translateX(0); } 18% { transform: translateX(554px); } 92% { transform: translateX(554px); } 98%, 100% { transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }

    .row { opacity: 0; animation: show 18s infinite both; }
    @keyframes show {
      0% { opacity: 0; transform: translateX(-10px); }
      3% { opacity: 1; transform: translateX(0); }
      92% { opacity: 1; transform: translateX(0); }
      97%, 100% { opacity: 0; }
    }
    .d0 { animation-delay: 3.4s; } .d1 { animation-delay: 4.0s; } .d2 { animation-delay: 4.6s; }
    .d3 { animation-delay: 5.2s; } .d4 { animation-delay: 5.8s; } .d5 { animation-delay: 6.4s; }
    .d6 { animation-delay: 7.0s; } .d7 { animation-delay: 7.6s; } .d8 { animation-delay: 8.4s; }
    .d9 { animation-delay: 9.0s; } .d10 { animation-delay: 9.6s; } .d11 { animation-delay: 10.2s; }

    .scan { animation: sweep 18s linear infinite; opacity: 0; }
    @keyframes sweep {
      0%, 18% { transform: translateY(0); opacity: 0; }
      21% { opacity: 0.8; }
      55% { transform: translateY(500px); opacity: 0.8; }
      58%, 100% { transform: translateY(500px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typer { animation: none; width: 560px; }
      .row { animation: none; opacity: 1; }
      .cursor, .scan { animation: none; opacity: 0; }
    }
  </style>

  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#ff69b4"/></pattern>
    <clipPath id="orb"><circle cx="195" cy="320" r="125"/></clipPath>
    <clipPath id="reveal"><rect class="typer" x="173" y="50" width="560" height="62"/></clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff69b4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff69b4" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- ventana -->
  <rect x="2" y="2" width="896" height="686" rx="18" fill="#1b0d17" stroke="#ff69b4" stroke-width="2"/>
  <circle cx="30" cy="28" r="6" fill="#ff5fa2"/>
  <circle cx="50" cy="28" r="6" fill="#ffb3d9"/>
  <circle cx="70" cy="28" r="6" fill="#ff85c0"/>

  <!-- bienvenida -->
  <text x="173" y="97" class="title" clip-path="url(#reveal)">Welcome to my profile</text>
  <rect class="cursor" x="173" y="61" width="14" height="42" fill="#ff69b4"/>
  <g class="row d0"><text x="450" y="132" text-anchor="middle" class="sub">&gt; scan complete: data science student | cat lover | pink fan</text></g>
  <line x1="30" y1="148" x2="870" y2="148" stroke="#ff69b4" stroke-opacity="0.4" stroke-dasharray="4 6"/>

  <!-- panel izquierdo -->
  <rect x="30" y="160" width="330" height="330" rx="10" fill="#240f1e" stroke="#ff69b4" stroke-opacity="0.7"/>
  <text x="46" y="184" class="tag">visual.map</text>
  <g clip-path="url(#orb)"><rect x="70" y="195" width="250" height="250" fill="url(#dots)" opacity="0.28"/></g>
  <g class="row d1">
    <text class="cat" xml:space="preserve" x="92" y="250">  /\_____/\</text>
    <text class="cat" xml:space="preserve" x="92" y="273"> /  o   o  \</text>
    <text class="cat" xml:space="preserve" x="92" y="296">( ==  ^  == )</text>
    <text class="cat" xml:space="preserve" x="92" y="319"> )         (</text>
    <text class="cat" xml:space="preserve" x="92" y="342">(           )</text>
    <text class="cat" xml:space="preserve" x="92" y="365">( (  )   (  ) )</text>
    <text class="cat" xml:space="preserve" x="92" y="388">(__(__)___(__)__)</text>
  </g>
  <g class="row d2">
    <text x="60" y="425" class="dim">&gt; cat_detected: true</text>
    <text x="60" y="445" class="dim">&gt; favorite_color: #ff69b4</text>
    <text x="60" y="465" class="dim">&gt; cuteness_level: 100%</text>
  </g>

  <!-- panel derecho -->
  <rect x="380" y="160" width="490" height="330" rx="10" fill="#240f1e" stroke="#ff69b4" stroke-opacity="0.7"/>
  <text x="396" y="184" class="tag">profile.scan</text>
  <text x="854" y="184" text-anchor="end" class="dim">● live</text>
  <g class="row d3"><text x="400" y="222" class="lbl">Subject</text><text x="510" y="222" class="val">Ana Gómez</text></g>
  <g class="row d4"><text x="400" y="254" class="lbl">Role</text><text x="510" y="254" class="val">Data Science student</text></g>
  <g class="row d5">
    <text x="400" y="286" class="lbl">Studies</text>
    <text x="510" y="286" class="val">1st year · BSc Data Science</text>
    <text x="510" y="305" class="val">Universidad Austral (Rosario)</text>
  </g>
  <g class="row d6"><text x="400" y="337" class="lbl">Status</text><text x="510" y="337" class="val">Learning | Exploring | Building</text></g>
  <g class="row d7">
    <text x="400" y="369" class="lbl">Languages</text>
    <text x="510" y="369" class="val">Python, R, HTML, CSS,</text>
    <text x="510" y="388" class="val">JavaScript, Git and GitHub</text>
  </g>
  <g class="row d8">
    <text x="400" y="420" class="lbl">Interests</text>
    <text x="510" y="420" class="val">Music, art and dance</text>
    <text x="510" y="439" class="val">seen through data</text>
  </g>

  <!-- about me -->
  <rect x="30" y="505" width="840" height="160" rx="10" fill="#240f1e" stroke="#ff69b4" stroke-opacity="0.7"/>
  <text x="46" y="529" class="tag">about.me</text>
  <g class="row d10">
    <text x="50" y="558" class="val">&gt; First-year Data Science student at Universidad Austral (Rosario).</text>
    <text x="50" y="584" class="val">&gt; Learning Python, R, HTML, CSS, JavaScript, Git and GitHub.</text>
  </g>
  <g class="row d11">
    <text x="50" y="610" class="val">&gt; Into music, art and dance: I want to analyze what works behind the scenes.</text>
    <text x="50" y="636" class="val">&gt; Open to joining any project. I love cats and the color pink.</text>
  </g>

  <!-- línea de escaneo -->
  <rect class="scan" x="34" y="154" width="832" height="26" fill="url(#beam)"/>
</svg>
