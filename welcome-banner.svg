<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" role="img" aria-label="Welcome to my profile" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .dim { fill: #b0588a; font-size: 12px; }
    .title { fill: #ff8fcb; font-size: 44px; font-weight: bold; }
    .sub { fill: #ffc2e2; font-size: 14px; }

    .typer { animation: type 9s steps(21) infinite; }
    @keyframes type {
      0%   { width: 0; }
      35%  { width: 560px; }
      92%  { width: 560px; }
      100% { width: 0; }
    }
    .cursor { animation: move 9s steps(21) infinite, blink 0.9s steps(1) infinite; }
    @keyframes move {
      0%   { transform: translateX(0); }
      35%  { transform: translateX(554px); }
      92%  { transform: translateX(554px); }
      100% { transform: translateX(0); }
    }
    @keyframes blink { 50% { opacity: 0; } }

    .sub-line { opacity: 0; animation: fade 9s infinite; }
    @keyframes fade {
      0%, 38% { opacity: 0; }
      44%, 90% { opacity: 1; }
      96%, 100% { opacity: 0; }
    }
    .beam { animation: sweep 5s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      90%  { opacity: 0.9; }
      100% { transform: translateX(880px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .typer { animation: none; width: 560px; }
      .cursor, .beam { animation: none; opacity: 0; }
      .sub-line { animation: none; opacity: 1; }
    }
  </style>

  <defs>
    <clipPath id="reveal"><rect class="typer" x="173" y="55" width="560" height="60"/></clipPath>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff69b4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff69b4" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="896" height="166" rx="18" fill="#1b0d17" stroke="#ff69b4" stroke-width="2"/>
  <circle cx="30" cy="28" r="6" fill="#ff5fa2"/>
  <circle cx="50" cy="28" r="6" fill="#ffb3d9"/>
  <circle cx="70" cy="28" r="6" fill="#ff85c0"/>

  <text x="173" y="100" class="title" clip-path="url(#reveal)">Welcome to my profile</text>
  <rect class="cursor" x="173" y="64" width="14" height="42" fill="#ff69b4"/>

  <g class="sub-line">
    <text x="450" y="140" text-anchor="middle" class="sub">&gt; scan complete: data science student | cat lover | pink fan</text>
  </g>

  <rect class="beam" x="10" y="45" width="14" height="110" fill="url(#glow)"/>
</svg>
