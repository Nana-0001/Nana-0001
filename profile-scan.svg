<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" role="img" aria-label="Perfil: estudiante de Ciencia de Datos, Universidad Austral de Rosario. Aprende Python, R, HTML, CSS, JavaScript, Git y GitHub." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .lbl { fill: #ff8fcb; font-size: 13px; }
    .val { fill: #ffe0f0; font-size: 14px; }
    .dim { fill: #b0588a; font-size: 12px; }
    .cat { fill: #ff9bd2; font-size: 18px; white-space: pre; }
    .tag { fill: #ff69b4; font-size: 13px; font-weight: bold; }

    .row { opacity: 0; animation: show 14s infinite both; }
    @keyframes show {
      0%   { opacity: 0; transform: translateX(-10px); }
      4%   { opacity: 1; transform: translateX(0); }
      90%  { opacity: 1; transform: translateX(0); }
      96%, 100% { opacity: 0; }
    }
    .d0 { animation-delay: 0.4s; }  .d1 { animation-delay: 1.0s; }
    .d2 { animation-delay: 1.6s; }  .d3 { animation-delay: 2.2s; }
    .d4 { animation-delay: 2.8s; }  .d5 { animation-delay: 3.4s; }
    .d6 { animation-delay: 4.0s; }  .d7 { animation-delay: 4.6s; }
    .d8 { animation-delay: 5.2s; }  .d9 { animation-delay: 5.8s; }

    .scan { animation: sweep 14s linear infinite; opacity: 0.8; }
    @keyframes sweep {
      0%   { transform: translateY(0); opacity: 0; }
      3%   { opacity: 0.8; }
      45%  { transform: translateY(420px); opacity: 0.8; }
      48%, 100% { transform: translateY(420px); opacity: 0; }
    }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .row, .scan, .blink { animation: none; opacity: 1; }
      .scan { opacity: 0; }
    }
  </style>

  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#ff69b4"/>
    </pattern>
    <clipPath id="orb"><circle cx="195" cy="250" r="150"/></clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff69b4" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff69b4" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- ventana -->
  <rect x="2" y="2" width="896" height="516" rx="18" fill="#1b0d17" stroke="#ff69b4" stroke-width="2"/>
  <circle cx="30" cy="28" r="6" fill="#ff5fa2"/>
  <circle cx="50" cy="28" r="6" fill="#ffb3d9"/>
  <circle cx="70" cy="28" r="6" fill="#ff85c0"/>


  <!-- panel izquierdo -->
  <rect x="30" y="50" width="330" height="440" rx="10" fill="#240f1e" stroke="#ff69b4" stroke-opacity="0.7"/>
  <text x="46" y="74" class="tag">visual.map</text>
  <g clip-path="url(#orb)">
    <rect x="45" y="100" width="300" height="300" fill="url(#dots)" opacity="0.28"/>
  </g>
  <g class="row d0">
    <text class="cat" xml:space="preserve" x="92" y="205">  /\_____/\</text>
    <text class="cat" xml:space="preserve" x="92" y="228"> /  o   o  \</text>
    <text class="cat" xml:space="preserve" x="92" y="251">( ==  ^  == )</text>
    <text class="cat" xml:space="preserve" x="92" y="274"> )         (</text>
    <text class="cat" xml:space="preserve" x="92" y="297">(           )</text>
    <text class="cat" xml:space="preserve" x="92" y="320">( (  )   (  ) )</text>
    <text class="cat" xml:space="preserve" x="92" y="343">(__(__)___(__)__)</text>
  </g>
  <g class="row d1">
    <text x="60" y="430" class="dim">&gt; gato_detectado: true</text>
    <text x="60" y="450" class="dim">&gt; color_favorito: #ff69b4</text>
    <text x="60" y="470" class="dim">&gt; nivel_de_ternura: 100%</text>
  </g>

  <!-- panel derecho -->
  <rect x="380" y="50" width="490" height="440" rx="10" fill="#240f1e" stroke="#ff69b4" stroke-opacity="0.7"/>
  <text x="396" y="74" class="tag">perfil.scan</text>
  <text x="854" y="74" text-anchor="end" class="dim">● live</text>

  <g class="row d1"><text x="400" y="110" class="lbl">Sujeto</text><text x="530" y="110" class="val">Ana Gómez</text></g>
  <g class="row d2"><text x="400" y="148" class="lbl">Rol</text><text x="530" y="148" class="val">Estudiante de Ciencia de Datos</text></g>
  <g class="row d3">
    <text x="400" y="186" class="lbl">Estudios</text>
    <text x="530" y="186" class="val">1er año · Lic. en Ciencia de Datos</text>
    <text x="530" y="205" class="val">Universidad Austral (Rosario)</text>
  </g>
  <g class="row d4"><text x="400" y="243" class="lbl">Estado</text><text x="530" y="243" class="val">Aprendiendo | Explorando | Creando</text></g>
  <g class="row d5">
    <text x="400" y="281" class="lbl">Lenguajes</text>
    <text x="530" y="281" class="val">Python, R, HTML, CSS,</text>
    <text x="530" y="300" class="val">JavaScript, Git y GitHub</text>
  </g>
  <g class="row d6">
    <text x="400" y="338" class="lbl">Intereses</text>
    <text x="530" y="338" class="val">Música, arte y baile</text>
    <text x="530" y="357" class="val">vistos desde los datos</text>
  </g>
  <g class="row d7"><text x="400" y="395" class="lbl">Abierta a</text><text x="530" y="395" class="val">Colaborar en proyectos</text></g>
  <g class="row d8"><text x="400" y="433" class="lbl">Extra</text><text x="530" y="433" class="val">Team gatos · Color rosa</text></g>

  <!-- línea de escaneo -->
  <g clip-path="inset(0)">
    <rect class="scan" x="384" y="54" width="482" height="26" fill="url(#beam)"/>
  </g>
</svg>
